<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純粹生存戰</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 左上角 UI：分數、血條、操作說明 -->
    <div id="ui-container">
        <div id="score">分數: 0</div>

        <div id="health-container">
            <span id="health-label">HP</span>
            <div id="health-bar-bg">
                <div id="health-bar-fill"></div>
            </div>
            <span id="health-text">100</span>
        </div>

        <div id="controls">
            [W][A][S][D] 移動 | [滑鼠左鍵] 射擊 | [R] 換彈 | [滾輪] 切換武器<br>
            <span style="color:#00ff00;">靠近敵人自動鎖定</span>
        </div>
    </div>

    <!-- 頂部中央波次顯示 -->
    <div id="wave-display">WAVE -</div>

    <!-- 右下角彈藥 UI -->
    <div id="ammo-container">
        <img id="weapon-icon" src="public/assets/pistol.png" alt="weapon icon">
        <div id="ammo-text">13 / ∞</div>
    </div>

    <!-- 遊戲結束 -->
    <div id="game-over">
        <h1 style="margin: 0 0 10px 0; color: #ff3333;">戰亡</h1>
        <p id="final-score" style="font-size: 24px; margin: 0;">最終分數: 0</p>
        <p id="final-wave" style="font-size: 18px; margin: 8px 0 0 0; color: #aaa;">最終波次: 1</p>
        <button onclick="restartGame()">重新部署</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>
</body>

</html>
