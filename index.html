<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純粹生存戰 - 手感與換彈優化版</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="ui-container">
        <div id="score">分數: 0</div>
        <div id="controls">[W][A][S][D] 移動 | [滑鼠左鍵] 射擊 (連發)<br><span style="color:#00ff00;">靠近敵人自動鎖定</span></div>
    </div>

    <div id="ammo-container">
        <img id="weapon-icon" src="public/assets/pistol.png" alt="weapon icon">
        <div id="ammo-text">13 / ∞</div>
    </div>

    <div id="game-over">
        <h1 style="margin: 0 0 10px 0; color: #ff3333;">戰亡</h1>
        <p id="final-score" style="font-size: 24px; margin: 0;">最終分數: 0</p>
        <button onclick="restartGame()">重新部署</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>
</body>

</html>
